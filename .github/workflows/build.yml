name: Build uscwifi-login ipk
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64
          - aarch64
          - mt7981b
        include:
          - target: x86_64
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          - target: aarch64
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/bcm27xx/bcm2711/openwrt-sdk-23.05.3-bcm27xx-bcm2711_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          - target: mt7981b
            sdk_url: https://downloads.openwrt.org/releases/23.05.3/targets/mediatek/filogic/openwrt-sdk-23.05.3-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev libssl-dev python3 python3-pip unzip wget rsync file

      - name: Cache OpenWrt SDK ${{ matrix.target }}
        uses: actions/cache@v4
        with:
          path: sdk
          key: sdk-${{ matrix.target }}-23.05.3-v4

      - name: Download and prepare OpenWrt SDK ${{ matrix.target }}
        run: |
          mkdir -p sdk
          cd sdk
          if [ ! -d "openwrt-sdk" ]; then
            rm -f *.tar.xz
            echo "Downloading SDK..."
            wget --retry-connrefused --tries=5 -q ${{ matrix.sdk_url }} -O sdk.tar.xz
            if ! file sdk.tar.xz | grep -q "XZ compressed data"; then
              echo "ERROR: Downloaded file is not valid XZ archive, probably 404 html"
              exit 1
            fi
            tar -xf sdk.tar.xz
            rm -f sdk.tar.xz
            mv openwrt-sdk-* openwrt-sdk
            cd openwrt-sdk
            # Add OpenWrt source as base feed for core packages (uci, uclient, libubox, etc.)
            # that are not included in the SDK or external feeds
            echo "src-git base https://github.com/openwrt/openwrt.git;v23.05.3" >> feeds.conf.default
            ./scripts/feeds update -a
            ./scripts/feeds install -a
          else
            echo "SDK found in cache, skipping download"
          fi

      - name: Copy package into SDK
        run: |
          rsync -av source/package/ sdk/openwrt-sdk/package/

      - name: Generate build config
        run: |
          cd sdk/openwrt-sdk
          # Generate default config non-interactively
          # (all packages set to =m, which is the standard SDK mode)
          make defconfig

      - name: Compile uscwifi-logind
        run: |
          cd sdk/openwrt-sdk
          make package/uscwifi-logind/compile V=s -j$(nproc)

      - name: Compile luci-app-uscwifi-login
        run: |
          cd sdk/openwrt-sdk
          make package/luci-app-uscwifi-login/compile V=s -j$(nproc)

      - name: Collect ipk artifacts
        run: |
          mkdir -p out/${{ matrix.target }}
          find sdk/openwrt-sdk/bin/packages -name "uscwifi*.ipk" -exec cp {} out/${{ matrix.target }}/ \;
          ls -la out/${{ matrix.target }}

      - name: Upload ${{ matrix.target }} ipk
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.target }}
          path: out/${{ matrix.target }}/*.ipk

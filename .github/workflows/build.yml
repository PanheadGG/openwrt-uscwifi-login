name: Build uscwifi-login ipk
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-logind:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
#          - x86_64
#          - aarch64
          - mt7981b
        include:
          - target: x86_64
            sdk_url: https://downloads.openwrt.org/releases/24.10.2/targets/x86/64/openwrt-sdk-24.10.2-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          - target: aarch64
            sdk_url: https://downloads.openwrt.org/releases/24.10.2/targets/bcm27xx/bcm2711/openwrt-sdk-24.10.2-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          - target: mt7981b
            sdk_url: https://downloads.openwrt.org/releases/24.10.2/targets/mediatek/filogic/openwrt-sdk-24.10.2-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev libssl-dev python3 python3-pip unzip wget rsync file cmake zstd

      - name: Cache OpenWrt SDK ${{ matrix.target }}
        uses: actions/cache@v4
        with:
          path: sdk
          key: sdk-${{ matrix.target }}-24.10.2-v1

      - name: Download and prepare OpenWrt SDK ${{ matrix.target }}
        run: |
          mkdir -p sdk
          cd sdk
          if [ ! -d "openwrt-sdk" ]; then
            rm -f sdk.tar.*
            echo "Downloading SDK..."
            wget --retry-connrefused --tries=5 -q ${{ matrix.sdk_url }} -O sdk.tar.zst
            if ! file sdk.tar.zst | grep -q "Zstandard compressed data"; then
              echo "ERROR: Downloaded file is not valid Zstandard archive, probably 404 html"
              exit 1
            fi
            tar -xf sdk.tar.zst
            rm -f sdk.tar.zst
            mv openwrt-sdk-* openwrt-sdk
            cd openwrt-sdk
            sed -i '/^src-git[a-z-]* base /d' feeds.conf.default
            echo "src-git base https://github.com/openwrt/openwrt.git;v24.10.2" >> feeds.conf.default
            ./scripts/feeds update -a
            ./scripts/feeds install -a
          else
            echo "SDK found in cache, skipping download"
          fi

      - name: Copy package into SDK
        run: |
          rsync -av source/package/ sdk/openwrt-sdk/package/

      - name: Generate build config
        run: |
          cd sdk/openwrt-sdk
          make defconfig

      - name: Verify base feed packages
        run: |
          cd sdk/openwrt-sdk
          echo "=== feeds.conf.default ==="
          cat feeds.conf.default
          echo "=== Installed base feed packages ==="
          ls -la package/feeds/base/ 2>/dev/null || echo "ERROR: package/feeds/base/ does not exist"
          test -d package/feeds/base/uci || { echo "ERROR: uci (provides libuci) not installed from base feed"; exit 1; }
          test -d package/feeds/base/uclient || { echo "ERROR: uclient (provides uclient-fetch) not installed from base feed"; exit 1; }
          echo "All required base feed packages are installed."

      - name: Build dependencies (libuci, uclient-fetch)
        run: |
          cd sdk/openwrt-sdk
          make package/uci/compile V=s -j$(nproc)
          make package/uclient/compile V=s -j$(nproc)

      - name: Compile uscwifi-logind
        run: |
          cd sdk/openwrt-sdk
          make package/uscwifi-logind/compile V=s -j$(nproc)

      - name: Collect ipk artifacts
        run: |
          mkdir -p out/${{ matrix.target }}
          find sdk/openwrt-sdk/bin/packages -name "uscwifi-logind*.ipk" -exec cp {} out/${{ matrix.target }}/ \;
          ls -la out/${{ matrix.target }}

      - name: Upload ${{ matrix.target }} ipk
        uses: actions/upload-artifact@v4
        with:
          name: ipk-logind-${{ matrix.target }}
          path: out/${{ matrix.target }}/*.ipk

  build-luci:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev libssl-dev python3 python3-pip unzip wget rsync file cmake zstd

      - name: Cache OpenWrt SDK luci
        uses: actions/cache@v4
        with:
          path: sdk
          key: sdk-luci-24.10.2-v1

      - name: Download and prepare OpenWrt SDK (x86_64 for luci)
        run: |
          mkdir -p sdk
          cd sdk
          if [ ! -d "openwrt-sdk" ]; then
            rm -f sdk.tar.*
            echo "Downloading SDK..."
            wget --retry-connrefused --tries=5 -q https://downloads.openwrt.org/releases/24.10.2/targets/x86/64/openwrt-sdk-24.10.2-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst -O sdk.tar.zst
            if ! file sdk.tar.zst | grep -q "Zstandard compressed data"; then
              echo "ERROR: Downloaded file is not valid Zstandard archive, probably 404 html"
              exit 1
            fi
            tar -xf sdk.tar.zst
            rm -f sdk.tar.zst
            mv openwrt-sdk-* openwrt-sdk
            cd openwrt-sdk
            sed -i '/^src-git[a-z-]* base /d' feeds.conf.default
            echo "src-git base https://github.com/openwrt/openwrt.git;v24.10.2" >> feeds.conf.default
            ./scripts/feeds update -a
            ./scripts/feeds install -a
          else
            echo "SDK found in cache, skipping download"
          fi

      - name: Copy package into SDK
        run: |
          rsync -av source/package/ sdk/openwrt-sdk/package/

      - name: Generate build config
        run: |
          cd sdk/openwrt-sdk
          make defconfig

      - name: Compile luci-app-uscwifi-login
        run: |
          cd sdk/openwrt-sdk
          make package/luci-app-uscwifi-login/compile V=s -j$(nproc)

      - name: Collect ipk artifacts
        run: |
          mkdir -p out/luci
          find sdk/openwrt-sdk/bin/packages -name "luci-app-uscwifi-login*.ipk" -exec cp {} out/luci/ \;
          ls -la out/luci

      - name: Upload luci ipk
        uses: actions/upload-artifact@v4
        with:
          name: ipk-luci-app
          path: out/luci/*.ipk
